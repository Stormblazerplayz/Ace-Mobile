name: iOS build

# Every run (pull requests, pushes to main and "Run workflow"):
#   1. builds the app for real iPhones and iPads (this is also the "does the code compile" check)
#   2. saves an unsigned .ipa as a workflow artifact
# Only on pushes to main or "Run workflow", and only once the Apple secrets are added:
#   3. signs the build with your App Store Connect API key
#   4. saves the signed .ipa as an artifact and uploads it to TestFlight
# Without the secrets, steps 3 and 4 are skipped with a note, and the run still passes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  # Only pull request checks get cancelled by a newer push. TestFlight runs wait their turn,
  # so an upload is never cut off halfway and every build number is used once.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build app (and TestFlight when set up)
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write   # to tag each TestFlight build (testflight-<number>)
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.stormblazerplayz.ace' }}
      EVENT_NAME: ${{ github.event_name }}
      UPLOAD_INPUT: ${{ inputs.upload }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check for Apple secrets
        id: signing
        run: |
          missing=""
          for pair in \
            "APP_STORE_CONNECT_KEY_ID=$ASC_KEY_ID" \
            "APP_STORE_CONNECT_ISSUER_ID=$ASC_ISSUER_ID" \
            "APP_STORE_CONNECT_KEY_P8=$ASC_KEY_P8" \
            "APPLE_TEAM_ID=$TEAM_ID"; do
            name="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::Apple secrets aren't set yet (missing:$missing). The app still builds and an unsigned .ipa is saved. See the README to set up TestFlight."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::notice title=TestFlight skipped::Pull requests only check the build. TestFlight runs on pushes to main or from Run workflow."
            echo "sign=false" >> "$GITHUB_OUTPUT"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sign=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" != "true" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the App Store Connect API key
        if: steps.signing.outputs.sign == 'true'
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          else
            # Also accept the .p8 file pasted as base64.
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH" 2>/dev/null || true
          fi
          chmod 600 "$KEY_PATH"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_PATH"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 doesn't look like a .p8 key. Paste the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Pick the build number
        run: |
          # TestFlight builds count up by 1: the newest build on TestFlight, plus 1.
          # Test runs (pull requests) don't upload, so they don't use up a number.
          if [ "${{ steps.signing.outputs.upload }}" = "true" ]; then
            N=$(python3 tools/next_build_number.py)
            echo "::notice title=Build number::This TestFlight build is number $N."
          else
            N=1
            echo "Not a TestFlight upload, so the build number stays 1."
          fi
          echo "BUILD_NUMBER=$N" >> "$GITHUB_ENV"

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Get the llama.cpp engine (for LFM3 Omni)
        id: llama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # llama.cpp's numbered builds (like b12380) each have a ready-made llama.xcframework.
          # Try the pinned build first, then the newest builds that have one.
          # If this step can't get it, the app still builds, just without the on-device model.
          set +e
          mkdir -p "$RUNNER_TEMP/llama" Vendor
          PINNED=b12380
          for TAG in "$PINNED" $(gh release list --repo ggml-org/llama.cpp --limit 15 --json tagName --jq '.[].tagName' | grep '^b'); do
            if gh release download "$TAG" --repo ggml-org/llama.cpp --pattern 'llama-*-xcframework.zip' --dir "$RUNNER_TEMP/llama"; then
              echo "Got llama.cpp $TAG"
              break
            fi
          done
          ZIP=$(find "$RUNNER_TEMP/llama" -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d "$RUNNER_TEMP/llama/unzipped"
            FW=$(find "$RUNNER_TEMP/llama/unzipped" -type d -name 'llama.xcframework' | head -n 1)
          fi
          if [ -n "$FW" ] && [ -d "$FW" ]; then
            rm -rf Vendor/llama.xcframework
            cp -R "$FW" Vendor/llama.xcframework
            python3 tools/make_llama_spec.py
            echo "spec=project-llama.yml" >> "$GITHUB_OUTPUT"
            echo "::notice title=LFM3 Omni engine::Built with llama.cpp from $(basename "$ZIP")."
            # Show the C functions Ace uses, to make build errors easy to fix.
            HDR=$(find Vendor/llama.xcframework -path '*ios-arm64/*' -name 'llama.h' | head -n 1)
            if [ -n "$HDR" ]; then
              grep -nE 'llama_(model_load_from_file|init_from_model|model_get_vocab|tokenize|token_to_piece|chat_apply_template|model_chat_template|batch_get_one|sampler_init_dist|vocab_is_eog)\(' "$HDR" | head -20
            fi
          else
            echo "spec=project.yml" >> "$GITHUB_OUTPUT"
            echo "::warning title=LFM3 Omni engine skipped::Couldn't get llama.xcframework, so this build has no on-device model."
          fi
          exit 0

      - name: Generate Xcode project
        run: xcodegen generate --spec "${{ steps.llama.outputs.spec || 'project.yml' }}"

      - name: Build the app
        run: |
          set -o pipefail
          # Built without signing. If the Apple secrets are set, the export step
          # below signs it with Apple's cloud-managed certificate using the API key,
          # so no certificate or provisioning profile is stored in this repo.
          xcodebuild archive \
            -project Ace.xcodeproj \
            -scheme Ace \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ace.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            DEVELOPMENT_TEAM="${TEAM_ID:-}" \
            ACE_BUNDLE_ID="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package an unsigned .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Ace.xcarchive/Products/Applications/Ace.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Ace.app wasn't found in the archive."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R "$APP" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "Ace-unsigned.ipa" Payload)
          ls -lh "$RUNNER_TEMP/unsigned/Ace-unsigned.ipa"

      - name: Save the unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Ace-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/unsigned/Ace-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Put the app's entitlements in the archive
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -euo pipefail
          # The archive is built unsigned, so it has no entitlements yet. Export reads them
          # from the app's signature to make the provisioning profile, so sign it ad hoc
          # with Config/Ace.entitlements (HomeKit) first. Export then signs it for real.
          APP="$RUNNER_TEMP/Ace.xcarchive/Products/Applications/Ace.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 | xargs -0 -I{} codesign --force --sign - {}
          fi
          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -print0 | xargs -0 -I{} codesign --force --sign - {}
          fi
          codesign --force --sign - --entitlements Config/Ace.entitlements "$APP"
          echo "Entitlements in the archive:"
          codesign -d --entitlements - "$APP" 2>/dev/null || true

      - name: Sign and export the .ipa
        if: steps.signing.outputs.sign == 'true'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Ace.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa was exported."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported $IPA_PATH (build $BUILD_NUMBER)"
          # Make sure the signed app kept its HomeKit entitlement (Apple Home control needs it).
          CHECK="$RUNNER_TEMP/ipa-check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          unzip -q "$IPA_PATH" -d "$CHECK"
          SIGNED=$(codesign -d --entitlements - "$CHECK/Payload/Ace.app" 2>/dev/null || true)
          echo "$SIGNED"
          if ! printf '%s' "$SIGNED" | grep -q "com.apple.developer.homekit"; then
            echo "::error title=HomeKit missing::The signed app has no HomeKit entitlement. Turn on HomeKit for the App ID in the Apple Developer site (Identifiers > $BUNDLE_ID)."
            exit 1
          fi
          echo "::notice title=HomeKit::The signed app has the HomeKit entitlement."

      - name: Save the signed .ipa
        if: steps.signing.outputs.sign == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ace-testflight-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: steps.signing.outputs.upload == 'true'
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice title=Uploaded::Build $BUILD_NUMBER is on its way to TestFlight. It shows up after Apple finishes processing it."

      - name: Remember the build number
        if: steps.signing.outputs.upload == 'true'
        run: |
          # The next run starts from this tag, even before Apple lists the build.
          if git tag "testflight-$BUILD_NUMBER" "$GITHUB_SHA" && git push origin "refs/tags/testflight-$BUILD_NUMBER"; then
            echo "Tagged testflight-$BUILD_NUMBER"
          else
            echo "::warning title=Build number tag::Couldn't add the testflight-$BUILD_NUMBER tag. The next build still reads the number from App Store Connect."
          fi

      - name: Remove the API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

  smartness:
    name: Brain smartness test (200 questions)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Pick the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Pick a simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = [int(x) for x in runtime.split("iOS-")[-1].split("-") if x.isdigit()]
              for d in devices:
                  if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')
          if [ -z "$DEST" ]; then echo "::error::No iPhone simulator found"; exit 1; fi
          echo "Using simulator $DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"

      - name: Run the smartness test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Ace.xcodeproj \
            -scheme Ace \
            -destination "id=${{ steps.sim.outputs.dest }}" \
            -only-testing:AceTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Show the score
        if: always()
        run: |
          LOG="$RUNNER_TEMP/test.log"
          [ -f "$LOG" ] || exit 0
          SCORE=$(grep -m1 'SMARTNESS SCORE:' "$LOG" || true)
          if [ -n "$SCORE" ]; then echo "::notice title=Ace smartness::${SCORE#*SMARTNESS }"; fi
          {
            echo "## Ace smartness test"
            echo '```'
            grep 'SMARTNESS' "$LOG" | grep -v 'MISS' || echo "No score (the test didn't run)"
            echo '```'
            echo "<details><summary>Misses</summary>"
            echo
            echo '```'
            grep 'SMARTNESS MISS' "$LOG" || echo "None"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
