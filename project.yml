# XcodeGen spec. The Xcode project is generated from this file
# (run `xcodegen generate`), so Ace.xcodeproj is never committed.
name: Ace
options:
  bundleIdPrefix: com.stormblazerplayz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "4.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # The CI build can change this with ACE_BUNDLE_ID=... The widget follows it.
    ACE_BUNDLE_ID: com.stormblazerplayz.ace
targets:
  Ace:
    type: application
    platform: iOS
    sources:
      - path: Ace
    dependencies:
      - target: AceWidgets
        embed: true
    settings:
      base:
        PRODUCT_NAME: Ace
        PRODUCT_BUNDLE_IDENTIFIER: $(ACE_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme: {}
  AceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Ace/Shared
    settings:
      base:
        PRODUCT_NAME: AceWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(ACE_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
